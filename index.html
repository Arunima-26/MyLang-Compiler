<!DOCTYPE html>
<html>
<head>
<title>Smart Compiler IDE</title>

<style>
body {
    margin: 0;
    font-family: Consolas;
    background: #0f172a;
    color: white;
}

.topbar {
    background: linear-gradient(90deg, pink, yellow, skyblue);
    padding: 10px;
    text-align: center;
    font-weight: bold;
}

.container {
    display: flex;
    height: 92vh;
}

.editor {
    width: 50%;
    padding: 10px;
    position: relative;
}

textarea {
    width: 100%;
    height: 300px;
    background: #020617;
    color: white;
    border: none;
    padding: 10px;
}

button {
    margin-top: 10px;
    padding: 10px;
    background: linear-gradient(45deg, pink, skyblue);
    border: none;
    cursor: pointer;
}

.right {
    width: 50%;
    display: flex;
    flex-direction: column;
}

.panel {
    flex: 1;
    margin: 5px;
    background: #020617;
    padding: 10px;
    overflow: auto;
}

/* Suggestions dropdown */
#suggestBox {
    position: absolute;
    background: #1e293b;
    border-radius: 5px;
    display: none;
    z-index: 100;
}

.suggestItem {
    padding: 5px;
    cursor: pointer;
}

.suggestItem:hover {
    background: #38bdf8;
}
</style>
</head>

<body>

<div class="topbar">🚀 Smart Compiler IDE</div>

<div class="container">

<div class="editor">

<textarea id="code" onkeyup="showSuggestions(event)">
start
let x = 5
print x
stop
</textarea>

<div id="suggestBox"></div>

<button onclick="runCode()">Run</button>

</div>

<div class="right">

<div class="panel">
<h3>Output</h3>
<pre id="output"></pre>
</div>

<div class="panel">
<h3>AI Suggestions</h3>
<pre id="ai"></pre>
</div>

<div class="panel">
<h3>Chatbot</h3>
<input id="chat">
<button onclick="askBot()">Ask</button>
<pre id="chatout"></pre>
</div>

</div>

</div>

<script>

/* KEYWORDS */
let keywords = ["start","stop","let","print","if","else","while","for","end"];

/* AUTO SUGGEST */
function showSuggestions(e){
    let textarea = document.getElementById("code");
    let box = document.getElementById("suggestBox");

    let text = textarea.value;
    let cursor = textarea.selectionStart;
    let word = text.substring(0,cursor).split(/\s/).pop();

    let matches = keywords.filter(k => k.startsWith(word));

    if(matches.length === 0){
        box.style.display = "none";
        return;
    }

    box.innerHTML = "";
    box.style.display = "block";
    box.style.top = "200px";
    box.style.left = "20px";

    matches.forEach(m=>{
        let div = document.createElement("div");
        div.innerText = m;
        div.className = "suggestItem";

        div.onclick = ()=>{
            textarea.value =
                text.substring(0,cursor-word.length) +
                m +
                text.substring(cursor);

            box.style.display = "none";
        };

        box.appendChild(div);
    });
}


/* RUN */
async function runCode(){
    let code = document.getElementById("code").value;

    let res = await fetch("/run", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({code})
    });

    let data = await res.json();

    document.getElementById("output").innerText = data.output;
    document.getElementById("ai").innerText = data.ai.join("\n");
}


/* CHATBOT */
function askBot(){
    let code = document.getElementById("code").value;
    let q = document.getElementById("chat").value.toLowerCase();

    let ans = "";

    if(q.includes("explain")){
        let lines = code.split("\n");
        lines.forEach((l,i)=>{
            if(l.trim() !== "")
                ans += "Line "+(i+1)+": "+l+"\n";
        });
    }
    else if(q.includes("loop"))
        ans = "Loops repeat execution (for, while).";

    else if(q.includes("variable"))
        ans = "Variables store data using 'let'.";

    else
        ans = "Ask: explain code / loop / variable";

    document.getElementById("chatout").innerText = ans;
}

</script>

</body>
</html>
